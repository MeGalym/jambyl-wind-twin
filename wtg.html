/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* тёмная студия: фон #0a0b0d, панели rgba(17,19,22,.86), красный — только главная цифра и тревога */
html,body{margin:0;height:100%;background:#0a0b0d;color:#e9ecef;font:13px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;display:grid;gap:10px;padding:14px;grid-template-columns:290px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"main . list" "card . list" "bar bar bar"}
button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid #f2b632;outline-offset:2px}
.pn{pointer-events:auto;background:rgba(17,19,22,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;min-width:0}
#p-main{grid-area:main;align-self:start}#p-list{grid-area:list;overflow:auto;scrollbar-width:none;align-self:start;max-height:100%}#p-card{grid-area:card;align-self:start}
#p-bar{grid-area:bar;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-self:center;max-width:100%;padding:8px 10px}
.ttl b{display:block;font-size:16px;font-weight:600}.ttl span{color:#8f97a3;font-size:11.5px}
.big{display:flex;align-items:baseline;gap:8px;margin-top:10px}.big b{font:600 44px/1 "Inter",system-ui;letter-spacing:-.03em;color:#ff4d3d;font-variant-numeric:tabular-nums}.big span{color:#8f97a3;font-size:15px}
.sub{color:#8f97a3;font-size:11.5px;margin:4px 0 10px;min-height:16px}
.sl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;color:#8f97a3;font-size:11.5px;align-items:center}.sl output{color:#e9ecef;font-variant-numeric:tabular-nums}.sl input{grid-column:1/-1;width:100%;accent-color:#f2b632;margin:0}
.sl.ex{grid-template-columns:auto 200px;flex:0 1 300px}.sl.ex input{grid-column:auto}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;margin:12px 0 0;font-size:12px}.kv dt{color:#8f97a3}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv dd.warn{color:#f2b632}.kv dd.alarm{color:#ff4d3d}.kv dd.ok{color:#2bd67b}
h3{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-weight:500;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:#8f97a3;white-space:nowrap}.pill.ok{color:#2bd67b}.pill.warn{color:#f2b632}.pill.alarm{color:#fff;background:#ff3b30}
.row{display:grid;grid-template-columns:minmax(0,1fr);width:100%;padding:6px 8px;border-radius:8px;font-size:12px;color:#c9ced6}.row:hover{background:rgba(255,255,255,.06)}.row.sel{background:rgba(242,182,50,.16);color:#fff}
.row.b{grid-template-columns:10px minmax(0,1fr);gap:1px 8px;align-items:center}.row.b i{width:8px;height:8px;border-radius:50%;background:#2bd67b}.row.b.warn i{background:#f2b632}.row.b.alarm i{background:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.25)}
.row.b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row.b b{font-weight:600;color:#fff}.row.b em{grid-column:2;font-style:normal;color:#8f97a3;font-size:11px;font-variant-numeric:tabular-nums}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:start}.ch b{font-size:13.5px}.x{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);text-align:center;line-height:20px;flex:none}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;gap:2px}.seg button{padding:6px 12px;border-radius:999px;color:#8f97a3;white-space:nowrap;font-size:12px}.seg button:hover{color:#fff}.seg button.on{background:#f2b632;color:#17120a;font-weight:600}
#c-note{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;margin:0;max-width:min(620px,calc(100% - 660px));text-align:center;color:rgba(255,255,255,.42);font-size:10.5px;line-height:1.4;pointer-events:none}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;padding:3px 9px;border-radius:999px;background:rgba(17,19,22,.82);border:1px solid rgba(255,255,255,.14);font-size:11px;white-space:nowrap;color:#e9ecef;will-change:transform}
.tag.sel{background:#f2b632;color:#17120a;border-color:transparent}
#c-toggle{display:none}
#hud,#hud *{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (max-width:1100px){
  #hud{grid-template-columns:250px minmax(0,1fr);grid-template-areas:"main ." "card ." "bar bar"}#c-note{display:none}.sl.ex{grid-template-columns:auto 130px}
  #p-list{display:none;position:absolute;right:14px;top:58px;bottom:112px;align-self:stretch;width:min(300px,calc(100% - 28px));max-height:none;z-index:3}
  #hud.open #p-list{display:block}#c-toggle{display:block;position:absolute;right:14px;top:14px;padding:8px 16px;z-index:4;border-radius:999px;font-weight:600}
}
@media (max-width:760px){
  #hud{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "card" "bar";padding:10px}
  .big b{font-size:32px}#c-kv{display:none}#p-main{padding:10px 12px;margin-right:84px}
  #p-list{right:10px;top:52px}#c-toggle{right:10px;top:10px}
  #p-card{align-self:end}#p-bar{gap:8px}.seg button{padding:6px 9px;font-size:11.5px}.tag{font-size:10px}
}

/* стройка ВЭУ */
#bld{display:none}
#hud.bld>.pn,#hud.bld>#c-note,#hud.bld>#tags{display:none!important}
#hud.bld #bld{display:contents}
#b-main{grid-area:main;align-self:start}#b-list{grid-area:list;align-self:start;overflow:auto;scrollbar-width:none;max-height:100%}
#b-bar{grid-area:bar;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-self:center;width:min(980px,100%);padding:9px 12px}
.bstep{margin-top:12px}.bstep em{display:block;font-style:normal;color:#f2b632;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.bstep b{display:block;font:600 21px/1.2 "Inter",system-ui;letter-spacing:-.01em;margin:3px 0 6px}.bstep p{margin:0;color:#aeb5bf;font-size:12.5px;line-height:1.45}
.row.bs{grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}.row.bs i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.row.bs em{font-style:normal;color:#8f97a3;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.bs.done i{background:#2bd67b}.row.bs.cur i{background:#f2b632;box-shadow:0 0 0 3px rgba(242,182,50,.25)}.row.bs.done span{color:#e9ecef}
.bb{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:500;white-space:nowrap;color:#e9ecef}.bb:hover{background:rgba(255,255,255,.16)}
.bb.main{background:#f2b632;color:#17120a;font-weight:600;min-width:150px;text-align:center}
.bsl{position:relative;flex:1 1 220px;grid-template-columns:1fr}.bsl i{position:absolute;bottom:-3px;width:2px;height:20px;margin-left:-1px;background:#fff;border-radius:1px;pointer-events:none}
@media (max-width:1100px){#b-list{display:none}}
@media (max-width:760px){.bstep b{font-size:17px}#b-main{margin-right:0}#b-kv{display:grid}.bb{padding:7px 10px}.bb.main{min-width:0}}
.bst{margin:10px 0 0;color:#f2b632;font-size:12px}
