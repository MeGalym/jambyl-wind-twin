<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жамбыл 1 ГВт — стройка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="epc.css?v=9">
</head>
<body>
<header id="bar">
  <div class="brand"><b>Жамбыл 1 ГВт</b><span>стройка ВЭС</span></div>
  <nav id="nav" aria-label="Разделы">
    <button data-v="map" aria-pressed="true">Карта</button>
    <button data-v="dash" aria-pressed="false">Дашборд</button>
    <button data-v="plan" aria-pressed="false">График</button>
    <button data-v="tasks" aria-pressed="false">Замечания<i id="n-tasks"></i></button>
    <button data-v="stock" aria-pressed="false">Склад</button>
  </nav>
  <a class="link" href="index.html#build">3D-вид</a>
</header>
<div id="datebar">
  <span class="lbl">Дата</span>
  <button id="d-prev" aria-label="На неделю назад">‹</button>
  <input id="d-range" type="range" min="0" max="1000" step="1" aria-label="Дата состояния">
  <button id="d-next" aria-label="На неделю вперёд">›</button>
  <output id="d-out"></output>
  <button id="d-today" class="ghost">Сегодня</button>
  <span id="d-src" class="dsrc"></span>
</div>
<main id="views">
  <section class="view" id="v-map">
    <aside id="left" aria-label="Стадии, слои и фильтры"></aside>
    <div id="mapbox">
      <div class="maphead"><label>Раскраска<select id="m-color"><option value="stage">Стадия работ</option><option value="ready">Что держит</option><option value="late">Отставание</option></select></label>
        <div class="zoom"><button id="z-out" aria-label="Отдалить">−</button><button id="z-in" aria-label="Приблизить">+</button><button id="z-fit">Вся</button></div></div>
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="План площадки сверху"></svg>
      <div id="mapnote"></div>
    </div>
    <aside id="right" aria-label="Состояние"></aside>
  </section>
  <section class="view page" id="v-dash" hidden></section>
  <section class="view page" id="v-plan" hidden></section>
  <section class="view page" id="v-tasks" hidden></section>
  <section class="view page" id="v-stock" hidden></section>
</main>
<input type="file" id="file" accept=".csv,.txt,.xlsx" hidden>
<div id="toast" role="status"></div>
<script src="site-data.js?v=22"></script>
<script src="wind.js?v=22"></script>
<script src="epcw.js?v=23"></script>
<script src="fact.js?v=2"></script>
<script src="epc.js?v=8"></script>
<script src="epc-views.js?v=7"></script>
</body>
</html>
