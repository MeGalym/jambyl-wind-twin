<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construct — строительство ВЭС</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="epc.css?v=11">
</head>
<body>
<div id="app">
<header id="top">
  <a class="brand glass" href="epc.html"><div class="brand-mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#16233B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="1.4"/><path d="M10 6.6V1.5M11.2 8.7l4.4 2.6M8.8 8.7l-4.4 2.6M10 9.4V18.5"/></svg></div><div><b>Construct</b><span>ВЭС Жамбыл 1 ГВт</span></div></a>
  <nav class="stages glass" aria-label="Этап"><a class="on" href="epc.html">Строительство</a><a href="index.html#ops">Эксплуатация</a><a href="index.html#cost">Смета</a><a href="index.html#wtg">Турбина</a></nav>
  <div class="chip glass"><span>Состояние на</span><b id="chip-date"></b><span id="d-src" class="dsrc"></span></div>
</header>
<div id="body">
<aside id="nav" class="glass" aria-label="Разделы">
  <h4>Строительство</h4>
  <a href="#v=dash" data-v="dash">Сводка</a>
  <a href="#v=map" data-v="map">Карта</a>
  <a href="#v=plan" data-v="plan">График</a>
  <a href="#v=p6" data-v="p6">Импорт графика P6</a>
  <a href="#v=drone" data-v="drone">Дрон и ИИ</a>
  <a href="#v=arch" data-v="arch">Архив снимков</a>
  <a href="#v=earth" data-v="earth">Земляные работы</a>
  <a href="#v=tasks" data-v="tasks">Замечания<i id="n-tasks"></i></a>
  <a href="#v=otk" data-v="otk">Приложение ОТК</a>
  <a href="#v=stock" data-v="stock">Склад</a>
  <h4>Проект</h4>
  <a href="index.html#build">3D-вид стройки</a>
  <a href="index.html#ops">3D-вид станции</a>
</aside>
<main id="main">
<div id="datebar" class="glass">
  <span class="lbl">Дата</span>
  <button id="d-prev" aria-label="На неделю назад">‹</button>
  <input id="d-range" type="range" min="0" max="1000" step="1" aria-label="Дата состояния">
  <button id="d-next" aria-label="На неделю вперёд">›</button>
  <output id="d-out"></output>
  <button id="d-today" class="ghost">Сегодня</button>
</div>
<div id="views">
  <section class="view" id="v-map" hidden>
    <aside id="left" aria-label="Стадии, слои и фильтры"></aside>
    <div id="mapbox">
      <div class="maphead"><label>Раскраска<select id="m-color"><option value="stage">Стадия работ</option><option value="ready">Что держит</option><option value="late">Отставание</option></select></label>
        <div class="seg" id="m-base" role="group" aria-label="Вид карты"></div><button class="segbtn" id="m-grp" title="Собрать ВЭУ в группы по фидерам">Группы</button><button class="segbtn" id="m-aer" title="Положить на карту снимки облёта">Аэросъёмка</button>
        <div class="zoom"><button id="z-out" aria-label="Отдалить">−</button><button id="z-in" aria-label="Приблизить">+</button><button id="z-fit">Вся</button></div></div>
      <div id="map" role="img" aria-label="Карта площадки"></div><div id="grid" aria-label="Матрица ВЭУ по фидерам"></div>
      <div id="aerline" hidden></div><div id="aerbar" hidden></div><div id="mapnote"></div>
    </div>
    <aside id="right" aria-label="Состояние"></aside>
  </section>
  <section class="view page" id="v-dash" hidden></section>
  <section class="view page" id="v-plan" hidden></section>
  <section class="view page" id="v-p6" hidden></section>
  <section class="view page" id="v-drone" hidden></section>
  <section class="view page" id="v-arch" hidden></section>
  <section class="view page" id="v-earth" hidden></section>
  <section class="view page" id="v-tasks" hidden></section>
  <section class="view page" id="v-otk" hidden></section>
  <section class="view page" id="v-stock" hidden></section>
</div>
</main>
</div>
</div>
<input type="file" id="file" accept=".csv,.txt,.xlsx" hidden>
<input type="file" id="p6file" accept=".xer,.xml,.xlsx,.csv,.txt" hidden>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="site-data.js?v=22"></script>
<script src="wind.js?v=22"></script>
<script src="epcw.js?v=24"></script>
<script src="fact.js?v=2"></script>
<script src="p6.js?v=2"></script>
<script src="epc.js?v=10"></script>
<script src="epc-views.js?v=8"></script>
<script src="epc-drone.js?v=2"></script>
<script src="epc-plus.js?v=2"></script>
</body>
</html>
