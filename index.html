<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construct — эксплуатация ВЭС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=26">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5b544" stop-opacity=".5"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></linearGradient>
</defs></svg>
<canvas id="scene" aria-label="3D-модель ветроэлектростанции"></canvas>
<div id="labels"></div>
<div id="tip"></div>

<div id="ui">
  <header id="top">
    <a class="brand glass" href="epc.html"><div class="brand-mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#16233B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="1.4"/><path d="M10 6.6V1.5M11.2 8.7l4.4 2.6M8.8 8.7l-4.4 2.6M10 9.4V18.5"/></svg></div><div><b>Construct</b><span>ВЭС Жамбыл 1 ГВт</span></div></a>
    <nav class="tabs glass" id="tabs" aria-label="Режим">
      <button data-stage="build" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h14M5 17V7l5-4 5 4v10M8 17v-5h4v5"/></svg>Строительство</button>
      <button data-stage="ops" aria-pressed="true"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2 4 11.5h5.2L8.4 18 16 8.2h-5.4z"/></svg>Эксплуатация</button>
      <button data-stage="cost" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="12" height="15" rx="2.5"/><path d="M7 6.5h6M7 10.5h6M7 14h3"/></svg>Смета</button>
      <button data-stage="wtg" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="1.4"/><path d="M10 6.6V1.5M11.2 8.7l4.4 2.6M8.8 8.7l-4.4 2.6M10 9.4V18.5"/></svg>Турбина</button>
    </nav>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
      <input id="q" type="search" placeholder="Найти WTG" autocomplete="off" aria-label="Поиск оборудования">
      <div id="suggest" class="glass"></div>
    </div>
    <button class="glass pbtn" id="pbtn" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 13V8M6.2 13V3M9.9 13V6.5M13.5 13V9.5"/></svg><span>Показатели</span></button>
    <div class="clock glass" id="clockbox"></div>
  </header>

  <aside id="left">
    <div class="menu glass" id="modes" role="group" aria-label="Слой данных"></div>
    <section class="card glass" id="legend"></section>
    <section class="card glass" id="insp"></section>
  </aside>
  <aside id="right"></aside>

  <div id="bot">
    <section class="card glass" id="side"></section>
    <footer id="time" class="glass">
      <div class="ctl" id="tl-ctl">
        <button class="play" id="play" aria-label="Проиграть"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path id="play-ic" d="M4 2.5v11l9-5.5z"/></svg></button>
        <button class="now" id="now">Сейчас</button>
      </div>
      <div class="chart" id="tl-chart">
        <span class="cap" id="cap"></span>
        <svg viewBox="0 0 1000 100" preserveAspectRatio="none">
          <path id="c-plan" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
          <path id="c-ghost" fill="rgba(255,255,255,.06)"/>
          <path id="c-area" fill="url(#gA)"/>
          <path id="c-line" fill="none" stroke="#f5b544" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
          <path id="c-fc" fill="none" stroke="#f5b544" stroke-width="1.4" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
          <line id="c-cur" y1="0" y2="100" stroke="#fff" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
        </svg>
        <input id="t" type="range" min="0" max="1435" step="5" value="750" aria-label="Время">
      </div>
      <div class="axis" id="axis"></div>
      <div id="bars" hidden></div>
    </footer>
  </div>
</div>
<div id="status"></div>
<div id="boot">Строю ветропарк: 140 ветроустановок…</div>
<script src="site-data.js?v=22"></script>
<script src="wind.js?v=22"></script>
<script src="epcw.js?v=24"></script>

</script>
<script type="module" src="app.js?v=31"></script>
</body>
</html>
